name: CD

on:
  push:
    branches: [ main ]

jobs:
  deploy-prod:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt Snowflake
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake==1.12.0

      - name: Setup dbt profile and Private Key
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOL
          banking_dbt:
            target: prod
            outputs:
              prod:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                private_key_path: /tmp/rsa_key.p8
                role: ACCOUNTADMIN
                database: BANKING_DB
                warehouse: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
                schema: ANALYTICS
                threads: 4
          EOL
          
          # Ghi private key chuẩn định dạng và cấp quyền đọc bảo mật
          printf "%s\n" "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/rsa_key.p8
          chmod 600 /tmp/rsa_key.p8

      - name: Test dbt connection (Debug)
        run: |
          cd dbt
          dbt debug --target prod --profiles-dir ~/.dbt

      - name: Deploy to Snowflake Prod
        run: |
          cd dbt
          dbt deps
          dbt run --target prod --profiles-dir ~/.dbt
          dbt test --target prod --profiles-dir ~/.dbt